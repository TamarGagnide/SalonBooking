spring:
  application:
    name: salon-booking
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:salonbooking}
    username: ${DB_USER:salonbooking}
    password: ${DB_PASSWORD:salonbooking}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always

server:
  # Render injects PORT; falls back to 8080 locally
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    # Comma-separated list of allowed frontend origins
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
