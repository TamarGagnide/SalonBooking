services:
  - type: web
    name: salonbooking-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: salonbooking-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: salonbooking-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: salonbooking-db, property: database }
      - key: DB_USER
        fromDatabase: { name: salonbooking-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: salonbooking-db, property: password }
      - key: CORS_ALLOWED_ORIGINS
        sync: false 

databases:
  - name: salonbooking-db
    plan: free
    databaseName: salonbooking
    user: salonbooking
