name: CI

# When the pipeline runs: on every push to main and on every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Three independent jobs. They run in parallel on separate fresh Ubuntu machines.
jobs:
  # 1. Backend: run all unit + integration tests against a real PostgreSQL.
  backend-tests:
    runs-on: ubuntu-latest

    # A throwaway Postgres container that lives next to the job. The integration
    # tests connect to it on localhost:5432 (same credentials as docker-compose).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salonbooking
          POSTGRES_USER: salonbooking
          POSTGRES_PASSWORD: salonbooking
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U salonbooking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # re-use downloaded Maven dependencies between runs
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        working-directory: backend
        run: mvn -B -DintegrationTest.dbHost=localhost test

  # 2. Frontend: install dependencies and make sure the production build succeeds.
  #    This is the same build Vercel runs, so a broken frontend is caught before deploy.
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci # exact versions from package-lock.json

      - name: Build
        working-directory: frontend
        run: npm run build

  # 3. Docker: make sure the backend image builds. Render builds this same Dockerfile.
  backend-docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t salonbooking-api backend
